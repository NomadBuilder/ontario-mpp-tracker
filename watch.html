<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Integrity news | OAC</title>
  <meta name="description" content="Sourced news and integrity items linked to Ontario MPPs — curated by Ontarians Against Corruption. Separate from the live MPP tracker embed.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="watch.css?v=5">
  <link rel="stylesheet" href="nav.css?v=2">
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <div class="top-bar">
        <div class="brand">
          <img src="assets/onac.png" alt="" width="36" height="36">
          <div>
            <a class="site-wordmark" href="landing.html">Accountability</a>
            <h1>Integrity news</h1>
            <p>Sourced news · integrity · expenses</p>
          </div>
        </div>
        <nav class="site-nav" aria-label="Accountability tools">
          <details class="site-nav-menu">
            <summary>Explore</summary>
            <div class="site-nav-panel">
              <a href="landing.html">Home<span class="hint">Accountability hub</span></a>
              <a href="./?embed=1">MPP tracker<span class="hint">Queen’s Park votes</span></a>
              <a href="meetings.html">City council watch<span class="hint">Data-centre sittings</span></a>
              <a href="map.html">Power map</a>
              <a href="cards.html">Player cards</a>
              <a class="current" href="watch.html" aria-current="page">Integrity news</a>
            </div>
          </details>
        </nav>
      </div>
      <p class="disclaimer">
        Sourced links to reporting and complaints — not a verdict of guilt.
      </p>
      <div class="filters">
        <label class="sr" for="q">Search</label>
        <input id="q" type="search" placeholder="Name, riding, or keyword…" autocomplete="off">
        <label class="sr" for="type">Type</label>
        <select id="type">
          <option value="">All types</option>
          <option value="news">News</option>
          <option value="integrity">Integrity</option>
          <option value="expenses">Expenses</option>
          <option value="investigation">Investigation</option>
        </select>
        <label class="sr" for="party">Party</label>
        <select id="party">
          <option value="">All parties</option>
          <option value="Progressive Conservative">PC</option>
          <option value="New Democratic">NDP</option>
          <option value="Liberal">Liberal</option>
          <option value="Green">Green</option>
          <option value="Independent">Independent</option>
        </select>
        <label class="sr" for="sort">Sort</label>
        <select id="sort">
          <option value="date">Newest</option>
          <option value="mpp">By MPP</option>
          <option value="type">By type</option>
        </select>
      </div>
    </div>
  </header>

  <div class="shell main-shell">
    <p class="count" id="count" aria-live="polite"></p>
    <main class="feed" id="feed"></main>
  </div>

  <footer class="foot">
    <div class="shell">
      <p>Built by <a href="https://onac.ca/">OAC</a></p>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-card" id="lightbox-card" role="dialog" aria-modal="true" aria-labelledby="lb-name"></div>
  </div>

  <script src="nav.js"></script>
  <script src="shared.js"></script>
  <script src="watch-app.js"></script>
</body>
</html>
